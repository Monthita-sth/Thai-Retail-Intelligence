services:

  postgres:
    image: postgres:16
    container_name: thai_retail_postgres

    environment:
      POSTGRES_USER: retail_admin
      POSTGRES_PASSWORD: retail_password
      POSTGRES_DB: thai_retail_dw

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: